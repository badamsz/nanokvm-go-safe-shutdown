name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Render screens against upstream appbase
        run: |
          pip install Pillow
          curl -fsSL -o "$RUNNER_TEMP/appbase.py" https://raw.githubusercontent.com/sipeed/NanoKVM-Go-Apps/base/appbase.py
          python3 tools/render_screens.py --appbase "$RUNNER_TEMP/appbase.py" --out "$RUNNER_TEMP/screens"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screens
          path: ${{ runner.temp }}/screens

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tag matches app.json version
        run: |
          version=$(python3 -c "import json;print(json.load(open('safe-shutdown/app.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.json version $version"
            exit 1
          fi
      - name: Build ZIP
        id: build
        run: echo "zip=$(tools/build_zip.sh)" >> "$GITHUB_OUTPUT"
      - name: Extract release notes from CHANGELOG
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "::error::No CHANGELOG entry for $GITHUB_REF_NAME"; exit 1; }
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: ${{ steps.build.outputs.zip }}
          body_path: ${{ runner.temp }}/notes.md
